name: Data Freshness Report

on:
  schedule:
    # Run every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      stale_days:
        description: 'Number of days before a model is considered stale'
        required: false
        default: '90'
      format:
        description: 'Output format (markdown or json)'
        required: false
        default: 'markdown'

jobs:
  freshness-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/setup-node@v4
        with:
          cache: bun
          cache-dependency-path: ./bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate freshness report
        id: report
        run: |
          STALE_DAYS="${{ github.event.inputs.stale_days || '90' }}"
          FORMAT="${{ github.event.inputs.format || 'markdown' }}"
          bun freshness --stale-days="${STALE_DAYS}" --format="${FORMAT}" > freshness-report.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat freshness-report.txt
        continue-on-error: true

      - name: Upload freshness report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report-${{ github.run_number }}
          path: freshness-report.txt
          retention-days: 30

      - name: Create GitHub issue if many stale models
        if: steps.report.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('freshness-report.txt', 'utf8');
            const title = `⚠️ Data Freshness Alert: High percentage of stale models`;
            const body = `## Automated Data Freshness Check\n\n${report.substring(0, 5000)}\n\n---\n*Generated by the weekly freshness workflow. Run #${{ github.run_number }}*`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['data-quality'],
            });
